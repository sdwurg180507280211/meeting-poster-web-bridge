<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>系列会议海报生成</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>系列会议海报生成</h1>
        <p>浏览器提交，真实 Photoshop 母版生成 PSD / PNG</p>
      </div>
      <span id="cloudState" class="badge">正在连接…</span>
    </header>

    <main class="layout">
      <form id="posterForm" class="form-panel">
        <section class="card">
          <h2>1. 会议信息</h2>
          <div class="grid2">
            <label>会议时间<input id="meetingTime" required placeholder="2026年8月20日 19:00-21:00" /></label>
            <label>会议地点<input id="meetingLocation" required placeholder="线上会议" /></label>
          </div>
        </section>

        <section class="card">
          <h2>2. 主席与讲者</h2>
          <div id="people"></div>
        </section>

        <section class="card">
          <h2>3. 会议日程</h2>
          <div id="schedule"></div>
        </section>

        <section class="card">
          <h2>4. 二维码</h2>
          <div class="upload-line">
            <input id="qrFile" type="file" accept="image/png,image/jpeg,image/webp" required />
            <img id="qrPreview" class="qr-preview" alt="二维码预览" />
          </div>
        </section>

        <section class="card">
          <h2>5. 输出</h2>
          <label>文件名<input id="outputName" value="系列会议海报" /></label>
          <button id="submitBtn" type="submit" class="primary">生成正式海报</button>
          <p class="tip">提交后请保持页面打开。你的 Mac 上 Photoshop Worker 在线时，一般几十秒内完成。</p>
        </section>
      </form>

      <aside class="result-panel">
        <div class="card sticky">
          <h2>任务状态</h2>
          <div id="jobStatus" class="status-box">尚未提交任务</div>
          <div id="progressSteps" class="steps"></div>
          <img id="resultPreview" class="result-preview" alt="生成结果" />
          <div id="downloads" class="downloads"></div>
          <pre id="debug" class="debug"></pre>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
