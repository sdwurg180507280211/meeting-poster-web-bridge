<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="简化版 Photoshop 海报编辑器：直接在海报上编辑文字、时间与素材，并通过本地 Photoshop PSD 母版生成 PNG。" />
  <title>简化版 Photoshop 海报编辑器</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="stylesheet" href="media/crop-modal.css" />
  <link rel="stylesheet" href="styles/poster-base.css" />
  <link rel="stylesheet" href="editor/poster-text.css" />
  <link rel="stylesheet" href="editor/asset-layout.css" />
  <link rel="stylesheet" href="editor/interaction-polish.css" />
  <link rel="stylesheet" href="editor/canvas-pan.css" />
  <link rel="stylesheet" href="editor/canvas-only.css" />
  <link rel="stylesheet" href="service/preflight.css" />
  <link rel="stylesheet" href="project/project-switcher.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">PS</div>
        <div>
          <h1>简化版 Photoshop 海报编辑器</h1>
          <p>海报内直接编辑 · Photoshop 母版生成 PNG</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="cloudState" class="badge">正在连接云端…</span>
        <button id="clearLocalData" class="privacy-reset-btn" type="button" title="清除本机草稿、素材和匿名历史身份">清除本机数据</button>
      </div>
    </header>

    <main class="editor-workspace canvas-only-workspace" id="editorWorkspace">
      <section class="stage-area">
        <div class="canvas-command-bar" aria-label="海报生成控制">
          <div class="canvas-job-state">
            <strong id="jobStatus">准备就绪</strong>
            <span id="progressSteps">双击文字编辑 · 点击头像或二维码上传 · L 调整布局</span>
          </div>
          <div class="canvas-command-actions">
            <button id="cancelActiveJob" type="button" class="canvas-secondary danger" hidden>取消任务</button>
            <button id="downloadResult" type="button" class="canvas-secondary" hidden>再次下载</button>
            <button id="submitBtn" type="submit" form="posterForm" class="canvas-generate">
              <span>生成正式海报</span>
              <small>完成后自动下载 PNG</small>
            </button>
          </div>
        </div>

        <div class="poster-viewport">
          <div id="posterCanvas" class="poster-canvas" aria-label="海报编辑画布"></div>
        </div>
      </section>
    </main>
  </div>

  <form id="posterForm" class="poster-data-form" aria-hidden="true">
    <input id="meetingTime" type="hidden" value="" />
    <input id="meetingLocation" type="hidden" value="线上" />
    <input id="outputName" type="hidden" value="系列会议海报" />
    <div id="people"></div>
    <div id="schedule"></div>
    <input id="qrFile" type="file" accept="image/png,image/jpeg,image/webp" />
    <img id="qrPreview" alt="二维码预览" />
    <span id="qrCropReadout">尚未应用裁剪</span>
  </form>

  <div id="avatarCropModal" class="crop-modal" hidden>
    <div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="avatarCropTitle">
      <div class="crop-dialog-head">
        <div>
          <h2 id="avatarCropTitle">裁剪头像</h2>
          <p>按住鼠标拖动图片 · 滚轮缩放 · 底部滑杆可精细控制缩放</p>
        </div>
        <button id="closeAvatarCrop" class="crop-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="crop-main">
        <div class="crop-stage-wrap avatar-stage-wrap">
          <div id="avatarCropStage" class="crop-stage avatar-crop-stage">
            <img id="avatarCropImage" alt="待裁剪头像" />
            <div class="avatar-crop-mask"></div>
          </div>
        </div>
        <p class="crop-help">圆形区域就是最终海报头像可见范围；弹窗中的缩放和位移会直接同步给 Photoshop。</p>
        <div class="crop-controls-large">
          <label for="avatarCropZoom">缩放</label>
          <input id="avatarCropZoom" type="range" min="20" max="350" step="1" value="100" />
          <span id="avatarCropZoomValue" class="crop-zoom-value">100%</span>
        </div>
      </div>
      <div class="crop-dialog-actions">
        <button id="resetAvatarCropModal" type="button" class="crop-action">重选图片</button>
        <div class="crop-action-group">
          <button id="cancelAvatarCrop" type="button" class="crop-action">取消</button>
          <button id="applyAvatarCrop" type="button" class="crop-action primary-action">应用裁剪</button>
        </div>
      </div>
    </div>
  </div>

  <div id="qrCropModal" class="crop-modal" hidden>
    <div class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="qrCropTitle">
      <div class="crop-dialog-head">
        <div>
          <h2 id="qrCropTitle">裁剪二维码</h2>
          <p>按住鼠标拖动图片 · 滚轮缩放 · 底部滑杆可精细控制缩放</p>
        </div>
        <button id="closeQrCrop" class="crop-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="crop-main">
        <div class="crop-stage-wrap">
          <div id="qrCropStage" class="crop-stage">
            <img id="qrCropImage" alt="待裁剪二维码" />
            <div class="crop-grid"></div>
          </div>
        </div>
        <p class="crop-help">白色正方形区域就是最终会放进海报的二维码图片范围</p>
        <div class="crop-controls-large">
          <label for="qrCropZoom">缩放</label>
          <input id="qrCropZoom" type="range" min="20" max="400" step="1" value="100" />
          <span id="qrCropZoomValue" class="crop-zoom-value">100%</span>
        </div>
      </div>
      <div class="crop-dialog-actions">
        <button id="resetQrCropModal" type="button" class="crop-action">重置</button>
        <div class="crop-action-group">
          <button id="cancelQrCrop" type="button" class="crop-action">取消</button>
          <button id="applyQrCrop" type="button" class="crop-action primary-action">应用裁剪</button>
        </div>
      </div>
    </div>
  </div>

  <script src="core/validation.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
    integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/moveable@0.53.0/dist/moveable.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="config.js"></script>
  <script src="project/poster-project.js"></script>
  <script src="project/asset-layout-profiles.js"></script>
  <script src="project/text-layout-profiles.js"></script>
  <script src="project/project-registry.js"></script>
  <script src="core/app.js"></script>
  <script src="core/fixed-defaults.js"></script>
  <script src="service/service-status.js"></script>
  <script src="service/text-layout-store.js"></script>
  <script src="core/draft-persistence.js"></script>
  <script src="editor/editor-mode.js"></script>
  <script src="editor/poster-preview.js"></script>
  <script src="editor/asset-layout.js"></script>
  <script src="editor/layout-tool.js"></script>
  <script src="editor/selection-polish.js"></script>
  <script src="media/avatar-crop-modal.js"></script>
  <script src="media/qr-crop-modal.js"></script>
  <script src="editor/agenda-professor.js"></script>
  <script src="editor/interaction-polish.js"></script>
  <script src="editor/canvas-pan.js"></script>
  <script src="service/preflight.js"></script>
</body>
</html>
