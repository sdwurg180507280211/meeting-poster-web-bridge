name: Verify Node PNG renderer

on:
  pull_request:
    paths:
      - 'render-worker/**'
      - 'tools/template-migration/**'
      - '.github/workflows/verify-node-renderer.yml'

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify runtime is independent from removed desktop renderers
        run: |
          if grep -R -n -E 'mac-agent|photoshop-worker|tools/template-migration|\.psd\b|sharp' src; then
            echo 'render-worker/src must not depend on removed desktop/PSD/Sharp runtime paths'
            exit 1
          fi
