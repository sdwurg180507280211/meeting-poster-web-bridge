name: Verify text layout editor

on:
  pull_request:
    paths:
      - 'web/poster-preview.js'
      - 'web/poster-text.css'
      - 'web/canvas-pan.js'
      - 'tests/text-layout.spec.js'
      - '.github/workflows/verify-text-layout.yml'

permissions:
  contents: read

jobs:
  text-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/poster-preview.js
      - run: node --check web/canvas-pan.js
      - run: node --check tests/text-layout.spec.js
      - name: Verify Photoshop-style interaction contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const preview = fs.readFileSync('web/poster-preview.js', 'utf8');
          const pan = fs.readFileSync('web/canvas-pan.js', 'utf8');
          const css = fs.readFileSync('web/poster-text.css', 'utf8');
          for (const token of [
            'dragGroupStart', 'dragGroup', 'dragGroupEnd',
            'event.metaKey || event.ctrlKey',
            'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
            'event.shiftKey ? 10 : 1',
            'text-selection-marquee',
            'hdistribute', 'vdistribute',
            'undoStack', 'redoStack',
          ]) {
            if (!preview.includes(token)) throw new Error(`poster-preview.js missing ${token}`);
          }
          if (!pan.includes("poster.classList.contains('is-text-layout-mode')")) {
            throw new Error('canvas pan must yield the poster surface to marquee selection in layout mode');
          }
          if (!css.includes('.text-layout-dock') || !css.includes('.text-selection-marquee')) {
            throw new Error('compact layout toolbar and marquee styling must remain present');
          }
          if (/protocolVersion|assetLayout|poster_jobs|supabase/i.test(preview)) {
            throw new Error('text layout editor must remain Web-preview-only and must not own render protocol logic');
          }
          NODE
