name: Verify asset layout editor

on:
  pull_request:
    paths:
      - 'web/project/asset-layout-profiles.js'
      - 'web/editor/asset-layout.js'
      - 'web/editor/asset-layout.css'
      - 'web/project/project-registry.js'
      - 'web/editor/editor-mode.js'
      - 'web/project/poster-project.js'
      - 'web/index.html'
      - 'tests/asset-layout.spec.js'
      - '.github/workflows/verify-asset-layout.yml'

permissions:
  contents: read

jobs:
  asset-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/project/asset-layout-profiles.js
      - run: node --check web/editor/asset-layout.js
      - run: node --check web/project/project-registry.js
      - run: node --check web/editor/editor-mode.js
      - run: node --check tests/asset-layout.spec.js
      - name: Verify PSD-synced asset layout contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const profiles = fs.readFileSync('web/project/asset-layout-profiles.js', 'utf8');
          const registry = fs.readFileSync('web/project/project-registry.js', 'utf8');
          const editor = fs.readFileSync('web/editor/asset-layout.js', 'utf8');
          const posterProject = fs.readFileSync('web/project/poster-project.js', 'utf8');
          const editorMode = fs.readFileSync('web/editor/editor-mode.js', 'utf8');

          const posterProjectIndex = html.indexOf('poster-project.js');
          const assetProfilesIndex = html.indexOf('asset-layout-profiles.js');
          const textProfilesIndex = html.indexOf('text-layout-profiles.js');
          const registryIndex = html.indexOf('project-registry.js');
          const editorModeIndex = html.indexOf('editor-mode.js');
          const textEditorIndex = html.indexOf('poster-preview.js');
          const assetEditorIndex = html.indexOf('asset-layout.js');
          if (!(posterProjectIndex >= 0 && assetProfilesIndex > posterProjectIndex && textProfilesIndex > assetProfilesIndex && registryIndex > textProfilesIndex)) {
            throw new Error('asset/text profiles must load after poster-project and before project-registry');
          }
          if (!(editorModeIndex >= 0 && textEditorIndex > editorModeIndex && assetEditorIndex > textEditorIndex)) {
            throw new Error('asset-layout.js must load after slots and text layout editor');
          }

          for (const token of ['yilu-changan-assets-v1', 'tonghu-jiankang-assets-v1', 'tongxin-hujian-assets-v1']) {
            if (!profiles.includes(token) || !registry.includes(token)) throw new Error(`missing asset layout profile ${token}`);
          }
          for (const token of [
            "posterAssetLayout:${project.id}:${PROFILE_ID}",
            "event.shiftKey ? 10 : 1",
            "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown",
            "dragGroupStart", "dragGroup", "dragGroupEnd",
            "project.assetPreview[key]",
            "poster-asset-layout-changed",
          ]) {
            if (!editor.includes(token)) throw new Error(`asset-layout.js missing ${token}`);
          }
          for (const removed of ['data-asset-align=', 'function alignSelection']) {
            if (editor.includes(removed)) throw new Error(`obsolete asset alignment control remains: ${removed}`);
          }
          if (!editorMode.includes("slot.className = 'canvas-avatar-slot canvas-asset-slot'")) throw new Error('avatar slots must be layout-editable');
          if (!editorMode.includes("qrSlot.dataset.key = 'qr'")) throw new Error('QR slot must expose its layout key');
          if (!editorMode.includes("document.addEventListener('dblclick'") || !editorMode.includes(".canvas-asset-slot")) {
            throw new Error('asset layout mode must support direct double-click crop editing');
          }

          for (const token of [
            'chair: toBox(project.assetPreview.chair)',
            'speaker1: toBox(project.assetPreview.speaker1)',
            'speaker2: toBox(project.assetPreview.speaker2)',
            'qrCode: toBox(project.assetPreview.qr)',
          ]) {
            if (!posterProject.includes(token)) throw new Error(`render contract no longer reads live asset geometry: ${token}`);
          }
          NODE