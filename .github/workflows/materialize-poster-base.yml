name: Materialize poster base

on:
  push:
    paths:
      - .github/workflows/materialize-poster-base.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize binary JPEG and remove obsolete loaders
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          source = subprocess.check_output([
              'git', 'show',
              '091821016320e9688f8d33ca4f3e49409c787a38:web/poster-base-preview.svg'
          ], text=True)
          match = re.search(r'data:image/jpeg;base64,([^"\']+)', source)
          if not match:
              raise SystemExit('poster base JPEG was not found in repository history')

          data = base64.b64decode(match.group(1), validate=True)
          if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
              raise SystemExit('decoded poster base is not a valid JPEG stream')

          assets = Path('web/assets')
          assets.mkdir(parents=True, exist_ok=True)
          (assets / 'poster-base.jpg').write_bytes(data)

          css = '''.poster-canvas{
            background-color:#fff;
            background-image:url("./assets/poster-base.jpg");
            background-position:center center;
            background-size:100% 100%;
            background-repeat:no-repeat;
          }
          .poster-canvas:before,.poster-art,.poster-watermark{display:none}
          .canvas-avatar-slot,.canvas-qr-slot{z-index:6;background:transparent;border:0;box-shadow:none}
          .canvas-avatar-slot span,.canvas-qr-slot span{padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.72);color:#6f78a0;box-shadow:0 2px 8px rgba(61,73,120,.10)}
          .canvas-avatar-slot img,.canvas-qr-slot img{z-index:2}
          '''
          Path('web/poster-base.css').write_text(css, encoding='utf-8')

          index = Path('web/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'\s*<link rel="stylesheet" href="poster-real-base\.css[^\"]*"\s*/>',
              '\n  <link rel="stylesheet" href="poster-base.css" />',
              html,
              count=1,
          )
          html = re.sub(
              r'\n\s*<script src="poster-base-runtime\.js[^\"]*"></script>',
              '',
              html,
              count=1,
          )
          index.write_text(html, encoding='utf-8')

          for old in [
              Path('web/poster-real-base.css'),
              Path('web/poster-base-runtime.js'),
              Path('web/poster-base/chunk-0.txt'),
              Path('web/assets/.keep'),
          ]:
              old.unlink(missing_ok=True)
          PY

      - name: Verify final architecture
        shell: bash
        run: |
          test -s web/assets/poster-base.jpg
          file web/assets/poster-base.jpg | grep -qi 'jpeg'
          grep -F 'url("./assets/poster-base.jpg")' web/poster-base.css
          ! grep -R -E 'data:image|poster-base-runtime|poster-real-base|poster-base/chunk-' web --exclude-dir=assets

      - name: Commit final static asset architecture
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: use static jpeg poster base'
          git push origin HEAD:main
