name: Apply unified editor interaction refactor

on:
  push:
    branches: [feat/unified-layout-auto-download]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-layout-auto-download
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def rep(p, old, new):
              s = read(p)
              if s.count(old) != 1:
                  raise SystemExit(f'{p}: expected one match, got {s.count(old)} for {old[:80]!r}')
              write(p, s.replace(old, new, 1))

          # Default double-click text editing + one visible layout entry.
          rep('web/editor/poster-preview.js',
              'aria-label="V 文字工具" data-tool-tip="V · 文字布局\\n调整当前项目的网页文字预览位置；布局自动保存到云端，不改变 PSD 文字排版。双击可编辑文字可直接原位修改；方向键微调位置。"><span class="tool-key">V</span><span>文字工具</span>',
              'aria-label="布局工具" data-tool-tip="布局工具\\n文字和头像/二维码均可移动或缩放；双击可编辑文字直接修改内容。文字布局自动保存，素材位置和尺寸同步 Photoshop。"><span class="tool-key">L</span><span>布局工具</span>')
          rep('web/editor/poster-preview.js',
              '  function beginInlineEdit(id) {\n    if (!layoutMode) return false;\n    const item = itemsById.get(id);',
              '  function beginInlineEdit(id) {\n    const item = itemsById.get(id);')
          rep('web/editor/poster-preview.js',
              '    inlineEdit = { el, item, input };\n    setSelection([el]);\n    destroyMoveable();',
              '    inlineEdit = { el, item, input };\n    if (layoutMode) setSelection([el]);\n    else clearSelection();\n    destroyMoveable();')

          p = 'web/editor/editor-mode.js'
          s = read(p)
          a = s.index("  document.addEventListener('dblclick', event => {")
          b = s.index("\n\n  document.getElementById('collapseInspector')", a)
          block = '''  document.addEventListener('dblclick', event => {\n    const target = event.target instanceof Element ? event.target : null;\n    if (!target || !poster.contains(target)) return;\n\n    const preview = target.closest('.poster-preview-text');\n    if (preview) {\n      event.preventDefault();\n      event.stopPropagation();\n      window.posterTextLayout?.beginInlineEdit?.(preview.dataset.previewTextId);\n      return;\n    }\n\n    if (!poster.classList.contains('is-asset-layout-mode')) return;\n    const slot = target.closest('.canvas-asset-slot');\n    if (!slot) return;\n    event.preventDefault();\n    event.stopPropagation();\n    const key = slot.dataset.key;\n    if (key === 'qr') {\n      openSection('qr');\n      if (window.posterQrCrop?.open) window.posterQrCrop.open();\n      else if (!qrInput?.files?.length) qrInput?.click();\n      return;\n    }\n    const file = document.getElementById(`${key}-file`);\n    openSection('people');\n    if (window.posterAvatarCrop?.open) window.posterAvatarCrop.open(key);\n    else if (!file?.files?.length) file?.click();\n  }, true);'''
          write(p, s[:a] + block + s[b:])

          write('web/editor/layout-tool.js', '''(() => {\n  'use strict';\n\n  const poster = document.getElementById('posterCanvas');\n  const button = document.querySelector('[data-layout-mode]');\n  const dock = button?.closest('.text-layout-dock');\n  const textLayout = window.posterTextLayout;\n  const assetLayout = window.posterAssetLayout;\n  const assetDock = document.querySelector('.asset-layout-dock');\n  if (!poster || !button || !dock || !textLayout || !assetLayout) return;\n\n  if (assetDock) assetDock.hidden = true;\n  const MOVEABLE_SELECTOR = '.moveable-control-box,.moveable-control,.moveable-line,.moveable-area';\n  let active = false;\n  let context = 'text';\n\n  function sync() {\n    dock.classList.toggle('is-active', active);\n    button.classList.toggle('active', active);\n    button.setAttribute('aria-pressed', String(active));\n  }\n\n  function activate(kind) {\n    context = kind === 'asset' ? 'asset' : 'text';\n    if (!active) return;\n    if (context === 'asset') {\n      textLayout.setEnabled(false);\n      assetLayout.setEnabled(true);\n    } else {\n      assetLayout.setEnabled(false);\n      textLayout.setEnabled(true);\n    }\n    sync();\n  }\n\n  function setEnabled(enabled) {\n    active = Boolean(enabled);\n    if (!active) {\n      textLayout.setEnabled(false);\n      assetLayout.setEnabled(false);\n      sync();\n      return;\n    }\n    activate('text');\n  }\n\n  button.addEventListener('click', event => {\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    setEnabled(!active);\n  }, true);\n\n  poster.addEventListener('pointerdown', event => {\n    if (!active || event.button !== 0) return;\n    const target = event.target instanceof Element ? event.target : null;\n    if (!target || target.closest(MOVEABLE_SELECTOR)) return;\n    if (target.closest('.canvas-asset-slot')) activate('asset');\n    else if (target.closest('.poster-preview-text') || target === poster) activate('text');\n  }, true);\n\n  sync();\n  window.posterLayoutTool = Object.freeze({\n    setEnabled,\n    isEnabled: () => active,\n    getContext: () => context,\n  });\n})();\n''')

          # Auto-download only the job initiated by Generate Poster.
          rep('web/core/app.js',
              "  const ACTIVE_JOB_KEY = 'meetingPosterActiveJobV1';",
              "  const ACTIVE_JOB_KEY = 'meetingPosterActiveJobV1';\n  const AUTO_DOWNLOAD_JOB_KEY = 'meetingPosterAutoDownloadJobV1';")
          rep('web/core/app.js',
              '      jobCreated = true;\n\n      saveActiveJob(jobId);',
              '      jobCreated = true;\n      writeLocalStorage(AUTO_DOWNLOAD_JOB_KEY, jobId);\n\n      saveActiveJob(jobId);')
          rep('web/core/app.js',
              "    downloads.append(pngBtn);\n  }",
              "    downloads.append(pngBtn);\n\n    if (readLocalStorage(AUTO_DOWNLOAD_JOB_KEY) === job.id) {\n      removeLocalStorage(AUTO_DOWNLOAD_JOB_KEY);\n      await downloadAs(png.data.signedUrl, `${baseName}.png`);\n    }\n  }")

          # Task control: retry is obsolete; successful results download existing PNG.
          p = 'web/service/task-controls.js'
          s = read(p)
          s = s.replace('已完成任务可直接查看海报；已完成、失败或取消的任务可使用原素材重新生成。', '已完成任务可直接查看或下载 PNG 海报。')
          old = '''      const canCancel = status === 'pending';\n      const canRetry = ['failed', 'succeeded', 'cancelled'].includes(status);\n      const isExpanded = status === 'succeeded' && expandedJobId === job.id;\n      const previewUrl = previewUrls.get(job.id) || '';\n\n      let actions = '';\n      if (status === 'succeeded') {\n        actions += `<button type="button" class="view" data-job-action="toggle-preview">${isExpanded ? '收起' : '查看'}</button>`;\n      }\n      if (canCancel) {\n        actions += '<button type="button" class="danger" data-job-action="cancel">取消任务</button>';\n      } else if (canRetry) {\n        actions += '<button type="button" class="primary" data-job-action="retry">重新生成</button>';\n      } else {\n        actions += '<button type="button" disabled>处理中不可强制取消</button>';\n      }'''
          new = '''      const canCancel = status === 'pending';\n      const isExpanded = status === 'succeeded' && expandedJobId === job.id;\n      const previewUrl = previewUrls.get(job.id) || '';\n\n      let actions = '';\n      if (status === 'succeeded') {\n        actions += `<button type="button" class="view" data-job-action="toggle-preview">${isExpanded ? '收起' : '查看'}</button>`;\n        actions += '<button type="button" class="primary" data-job-action="download">下载</button>';\n      } else if (canCancel) {\n        actions += '<button type="button" class="danger" data-job-action="cancel">取消任务</button>';\n      } else if (['claimed', 'rendering', 'uploading'].includes(status)) {\n        actions += '<button type="button" disabled>处理中不可强制取消</button>';\n      }'''
          if old not in s: raise SystemExit('task action block not found')
          s = s.replace(old, new, 1)
          marker = "  function client() { return window.POSTER_APP_CLIENT || null; }"
          s = s.replace(marker, '''  function safeDownloadName(name) {\n    return (String(name || '系列会议海报').trim() || '系列会议海报').replace(/[\\\\/:*?"<>|]/g, '_');\n  }\n\n''' + marker, 1)
          a = s.index('  async function runAction(item, action) {')
          b = s.index("\n\n  list.addEventListener('click'", a)
          replacement = '''  async function downloadJob(item, button) {\n    const sb = client();\n    if (!sb || typeof window.downloadAs !== 'function') return;\n    const job = currentJobs.find(entry => entry.id === item.dataset.jobId);\n    if (!job || job.status !== 'succeeded' || !job.result_png_path) return;\n    button.disabled = true;\n    try {\n      const bucket = sb.storage.from(cfg.BUCKET || 'poster-assets');\n      const { data, error } = await bucket.createSignedUrl(job.result_png_path, 1800);\n      if (error) throw error;\n      if (!data?.signedUrl) throw new Error('未返回海报下载地址');\n      const name = safeDownloadName(job.payload?.meeting?.outputName || '系列会议海报');\n      await window.downloadAs(data.signedUrl, `${name}.png`);\n    } catch (error) {\n      alert(`海报下载失败：${error.message || error}`);\n    } finally {\n      button.disabled = false;\n    }\n  }\n\n  async function cancelJob(item) {\n    if (actionBusy) return;\n    const sb = client();\n    if (!sb) return;\n    const jobId = item.dataset.jobId;\n    if (!jobId || item.dataset.jobStatus !== 'pending') return;\n    if (!window.confirm('确定取消这个排队中的任务吗？')) return;\n\n    actionBusy = true;\n    card.querySelectorAll('button').forEach(button => { button.disabled = true; });\n    try {\n      const { error } = await sb.rpc('cancel_poster_job', { p_job_id: jobId });\n      if (error) throw error;\n      try { localStorage.removeItem('meetingPosterActiveJobV1'); } catch (_) {}\n      window.location.reload();\n    } catch (error) {\n      alert(`取消失败：${error.message || error}`);\n      actionBusy = false;\n      card.querySelectorAll('button').forEach(button => { button.disabled = false; });\n      await load();\n    }\n  }'''
          s = s[:a] + replacement + s[b:]
          old_click = '''    if (button.dataset.jobAction === 'toggle-preview') {\n      void togglePreview(item);\n      return;\n    }\n    void runAction(item, button.dataset.jobAction);'''
          new_click = '''    if (button.dataset.jobAction === 'toggle-preview') {\n      void togglePreview(item);\n      return;\n    }\n    if (button.dataset.jobAction === 'download') {\n      void downloadJob(item, button);\n      return;\n    }\n    if (button.dataset.jobAction === 'cancel') void cancelJob(item);'''
          if old_click not in s: raise SystemExit('task click block not found')
          s = s.replace(old_click, new_click, 1)
          if '重新生成' in s or 'retry_poster_job' in s or 'data-job-action="retry"' in s:
              raise SystemExit('obsolete retry UI remains')
          write(p, s)

          rep('web/service/preflight.js', "db.jobControlsAvailable ? '取消 / 重新生成 RPC 已安装' : '任务控制 RPC 缺失'", "db.jobControlsAvailable ? '任务控制 RPC 已安装' : '任务控制 RPC 缺失'")

          # Current PNG-only copy and module order.
          rep('web/index.html', '系列会议海报在线编辑与 Photoshop PSD 生成工具。', '系列会议海报在线编辑与 Photoshop PNG 生成工具。')
          rep('web/index.html', '交给 Mac Photoshop 渲染 PSD / PNG', '交给 Mac Photoshop 渲染 PNG')
          rep('web/index.html', '  <script src="editor/asset-layout.js"></script>\n  <script src="editor/selection-polish.js"></script>', '  <script src="editor/asset-layout.js"></script>\n  <script src="editor/layout-tool.js"></script>\n  <script src="editor/selection-polish.js"></script>')

          # Browser tests: unified entry, default double-click editing, download instead of retry.
          p = 'tests/text-layout.spec.js'; s = read(p)
          s = s.replace("test('V is explained as cloud-saved Web text layout and has no reset or arrow action buttons'", "test('layout tool is the single text and asset geometry entry'")
          s = s.replace("  await expect(mode).toHaveAttribute('aria-label', 'V 文字工具');\n  await expect(mode).toHaveAttribute('data-tool-tip', /V · 文字布局/);\n  await expect(mode).toHaveAttribute('data-tool-tip', /自动保存到云端/);\n  await expect(mode).toHaveAttribute('data-tool-tip', /不改变 PSD 文字排版/);", "  await expect(mode).toHaveAttribute('aria-label', '布局工具');\n  await expect(mode).toHaveAttribute('data-tool-tip', /文字和头像\\/二维码均可移动或缩放/);\n  await expect(page.locator('.asset-layout-dock')).toBeHidden();")
          s = s.replace("test('double-clicking editable text in V mode edits in place and syncs the form field', async ({ page }) => {\n  await page.locator('#chair-name').fill('张三');\n  await enableLayout(page);", "test('double-clicking editable text works by default and syncs the form field', async ({ page }) => {\n  await page.locator('#chair-name').fill('张三');\n  await expect.poll(() => page.evaluate(() => window.posterLayoutTool?.isEnabled?.())).toBe(false);")
          write(p, s)

          p = 'tests/asset-layout.spec.js'; s = read(p)
          a = s.index('async function enableAssets(page) {'); b = s.index('\n}\n\ntest.beforeEach', a) + 2
          s = s[:a] + '''async function enableAssets(page) {\n  await expect(page.locator('[data-layout-mode]')).toBeVisible();\n  await page.locator('[data-layout-mode]').click();\n  await expect.poll(() => page.evaluate(() => window.posterLayoutTool?.isEnabled?.())).toBe(true);\n}''' + s[b:]
          s = s.replace("test('A is explained as the project asset tool and has no reset or arrow action buttons'", "test('layout tool is the only visible entry for text and asset geometry'")
          old = '''  const mode = page.locator('.asset-layout-mode-btn');\n  await expect(mode).toHaveAttribute('aria-label', 'A 素材工具');\n  await expect(mode).toHaveAttribute('data-tool-tip', /A · 素材工具/);\n  await expect(mode).toHaveAttribute('data-tool-tip', /位置和尺寸会同步 Photoshop/);'''
          new = '''  const mode = page.locator('[data-layout-mode]');\n  await expect(mode).toHaveAttribute('aria-label', '布局工具');\n  await expect(mode).toHaveAttribute('data-tool-tip', /文字和头像\\/二维码均可移动或缩放/);\n  await expect(page.locator('[data-asset-layout-mode]')).toBeHidden();'''
          if old not in s: raise SystemExit('asset label test block not found')
          s = s.replace(old, new, 1)
          s = s.replace("  await page.locator('[data-layout-mode]').click();\n  expect(await page.evaluate(() => ({ text: window.posterTextLayout.isEnabled(), assets: window.posterAssetLayout.isEnabled() }))).toEqual({ text: true, assets: false });\n\n", '')
          s = s.replace("test('asset overrides stay project-local and text/asset modes are mutually exclusive'", "test('asset overrides stay project-local under the unified layout tool'")
          write(p, s)

          p = 'tests/editor.spec.js'; s = read(p)
          s = s.replace("test('task tab exposes safe cancel, retry, view and collapse actions'", "test('task tab exposes safe cancel, download, view and collapse actions'")
          s = s.replace("  await expect(page.locator('.task-control-item[data-job-status=\"failed\"] [data-job-action=\"retry\"]')).toHaveText('重新生成');\n\n", "  await expect(page.locator('.task-control-item[data-job-status=\"failed\"] [data-job-action=\"retry\"]')).toHaveCount(0);\n\n")
          s = s.replace("  await expect(succeeded.locator('[data-job-action=\"retry\"]')).toHaveText('重新生成');", "  await expect(succeeded.locator('[data-job-action=\"download\"]')).toHaveText('下载');")
          write(p, s)
          PY

          node --check web/core/app.js
          node --check web/editor/poster-preview.js
          node --check web/editor/editor-mode.js
          node --check web/editor/asset-layout.js
          node --check web/editor/layout-tool.js
          node --check web/service/task-controls.js
          node --check web/service/preflight.js
          node --check tests/text-layout.spec.js
          node --check tests/asset-layout.spec.js
          node --check tests/editor.spec.js
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web tests
          git commit -m 'feat: unify poster layout interactions and downloads'
          git push origin HEAD:feat/unified-layout-auto-download
