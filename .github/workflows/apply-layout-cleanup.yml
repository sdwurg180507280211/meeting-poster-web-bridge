name: Apply unified layout cleanup

on:
  push:
    branches: [feat/unified-layout-auto-download]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-layout-auto-download
      - name: Remove obsolete asset toolbar and update selection tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, content): Path(path).write_text(content, encoding='utf-8')
          def rep(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              write(path, text.replace(old, new, 1))

          path = 'web/editor/asset-layout.js'
          text = read(path)
          text = text.replace("  const LABELS = Object.freeze({ chair: '主席头像', speaker1: '讲者一头像', speaker2: '讲者二头像', qr: '二维码' });\n", '')

          old_toolbar = '''  function updateToolbar() {\n    const count = selected.size;\n    countLabel.textContent = count ? `已选 ${count} 项` : '未选择';\n    if (count === 1) {\n      const key = [...selected][0];\n      const spec = normalizeSpec(key, project.assetPreview[key]);\n      readout.textContent = `${LABELS[key]} · X ${spec.left} · Y ${spec.top} · ${spec.size}×${spec.size}`;\n    } else {\n      readout.textContent = count > 1 ? '批量移动 · 尺寸单独调整' : '';\n    }\n  }\n\n'''
          if old_toolbar not in text: raise SystemExit('asset updateToolbar block missing')
          text = text.replace(old_toolbar, '', 1)
          text = text.replace('    updateToolbar();\n', '')
          text = text.replace('  updateToolbar();\n', '')

          old_dock = '''  const dock = document.createElement('div');\n  dock.className = 'asset-layout-dock';\n  dock.innerHTML = `\n    <button type="button" class="asset-layout-mode-btn" data-asset-layout-mode aria-label="A 素材工具" data-tool-tip="A · 素材工具\\n本项目的头像/二维码工具。选择后可拖动或缩放；双击重新裁剪。位置和尺寸会同步 Photoshop。"><span class="tool-key">A</span><span>素材工具</span></button>\n    <div class="asset-layout-tools" data-asset-layout-tools hidden>\n      <span class="asset-layout-count" data-asset-layout-count>未选择</span>\n      <span class="asset-layout-readout" data-asset-layout-readout></span>\n    </div>`;\n  document.querySelector('.stage-area')?.appendChild(dock);\n\n  const modeButton = dock.querySelector('[data-asset-layout-mode]');\n  const tools = dock.querySelector('[data-asset-layout-tools]');\n  const countLabel = dock.querySelector('[data-asset-layout-count]');\n  const readout = dock.querySelector('[data-asset-layout-readout]');\n\n'''
          if old_dock not in text: raise SystemExit('asset dock block missing')
          text = text.replace(old_dock, '', 1)

          old_mode = '''  function setMode(enabled) {\n    active = Boolean(enabled);\n    if (active) window.posterTextLayout?.setEnabled?.(false);\n    poster.classList.toggle('is-asset-layout-mode', active);\n    dock.classList.toggle('is-active', active);\n    modeButton.classList.toggle('active', active);\n    tools.hidden = !active;\n    if (!active) clearSelection();\n  }'''
          new_mode = '''  function setMode(enabled) {\n    active = Boolean(enabled);\n    poster.classList.toggle('is-asset-layout-mode', active);\n    if (!active) clearSelection();\n  }'''
          if old_mode not in text: raise SystemExit('asset setMode block missing')
          text = text.replace(old_mode, new_mode, 1)

          old_listeners = '''  modeButton.addEventListener('click', () => setMode(!active));\n  document.querySelector('[data-layout-mode]')?.addEventListener('click', () => {\n    if (active) setMode(false);\n  }, true);\n\n'''
          if old_listeners not in text: raise SystemExit('asset mode listeners missing')
          text = text.replace(old_listeners, '', 1)

          for obsolete in ['asset-layout-dock', 'asset-layout-mode-btn', 'data-asset-layout-mode', 'data-asset-layout-count', '素材工具']:
              if obsolete in text: raise SystemExit(f'obsolete asset toolbar token remains: {obsolete}')
          write(path, text)

          path = 'tests/selection-polish.spec.js'
          text = read(path)
          text = text.replace(
              "    window.posterTextLayout && window.posterAssetLayout && window.posterSelectionPolish && window.Moveable\n",
              "    window.posterTextLayout && window.posterAssetLayout && window.posterLayoutTool && window.posterSelectionPolish && window.Moveable\n",
              1,
          )
          start = text.index('async function enableText(page) {')
          end = text.index('\n\ntest.beforeEach', start)
          helpers = '''async function enableLayout(page) {\n  await page.locator('[data-layout-mode]').click();\n  await expect.poll(() => page.evaluate(() => window.posterLayoutTool.isEnabled())).toBe(true);\n}'''
          text = text[:start] + helpers + text[end:]
          text = text.replace('await enableText(page);', 'await enableLayout(page);')
          text = text.replace('await enableAsset(page);', 'await enableLayout(page);')
          text = text.replace("test('clicking anywhere outside the poster clears text selection but keeps V mode active'", "test('clicking anywhere outside the poster clears text selection but keeps layout tool active'")
          text = text.replace("test('clicking the inspector outside the poster clears asset selection but keeps A mode active'", "test('clicking the inspector outside the poster clears asset selection but keeps layout tool active'")

          old_status = '''test('even clicking the floating tool status outside poster clears the active selection', async ({ page }) => {\n  await enableLayout(page);\n  await page.locator('.canvas-asset-slot[data-key="qr"]').click();\n  await expect.poll(() => page.evaluate(() => window.posterAssetLayout.getSelectedKeys())).toEqual(['qr']);\n\n  await page.locator('[data-asset-layout-count]').click();\n  await expect.poll(() => page.evaluate(() => window.posterAssetLayout.getSelectedKeys())).toEqual([]);\n  expect(await page.evaluate(() => window.posterAssetLayout.isEnabled())).toBe(true);\n});'''
          new_status = '''test('turning off the unified layout tool clears the active asset selection', async ({ page }) => {\n  await enableLayout(page);\n  await page.locator('.canvas-asset-slot[data-key="qr"]').click();\n  await expect.poll(() => page.evaluate(() => window.posterAssetLayout.getSelectedKeys())).toEqual(['qr']);\n\n  await page.locator('[data-layout-mode]').click();\n  await expect.poll(() => page.evaluate(() => ({\n    layout: window.posterLayoutTool.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    selected: window.posterAssetLayout.getSelectedKeys(),\n  }))).toEqual({ layout: false, asset: false, selected: [] });\n});'''
          if old_status not in text: raise SystemExit('old floating status test missing')
          text = text.replace(old_status, new_status, 1)

          old_switch = '''test('switching V and A modes clears stale selection and keeps only one mode active', async ({ page }) => {\n  await enableLayout(page);\n  await page.locator('[data-preview-text-id="section-chair"]').click();\n  await expect.poll(() => page.evaluate(() => window.posterTextLayout.getSelectedIds().length)).toBe(1);\n\n  await page.locator('.asset-layout-mode-btn').click();\n  await expect.poll(() => page.evaluate(() => ({\n    text: window.posterTextLayout.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    textCount: window.posterTextLayout.getSelectedIds().length,\n  }))).toEqual({ text: false, asset: true, textCount: 0 });\n\n  await page.locator('.canvas-asset-slot[data-key="qr"]').click();\n  await expect.poll(() => page.evaluate(() => window.posterAssetLayout.getSelectedKeys())).toEqual(['qr']);\n\n  await page.locator('.text-layout-mode-btn').click();\n  await expect.poll(() => page.evaluate(() => ({\n    text: window.posterTextLayout.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    assetCount: window.posterAssetLayout.getSelectedKeys().length,\n  }))).toEqual({ text: true, asset: false, assetCount: 0 });\n});'''
          new_switch = '''test('one layout tool switches context by the selected object and clears stale selection', async ({ page }) => {\n  await enableLayout(page);\n  await page.locator('[data-preview-text-id="section-chair"]').click();\n  await expect.poll(() => page.evaluate(() => ({\n    text: window.posterTextLayout.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    textCount: window.posterTextLayout.getSelectedIds().length,\n  }))).toEqual({ text: true, asset: false, textCount: 1 });\n\n  await page.locator('.canvas-asset-slot[data-key="qr"]').click();\n  await expect.poll(() => page.evaluate(() => ({\n    context: window.posterLayoutTool.getContext(),\n    text: window.posterTextLayout.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    textCount: window.posterTextLayout.getSelectedIds().length,\n    assetKeys: window.posterAssetLayout.getSelectedKeys(),\n  }))).toEqual({ context: 'asset', text: false, asset: true, textCount: 0, assetKeys: ['qr'] });\n\n  await page.locator('[data-preview-text-id="section-chair"]').click();\n  await expect.poll(() => page.evaluate(() => ({\n    context: window.posterLayoutTool.getContext(),\n    text: window.posterTextLayout.isEnabled(),\n    asset: window.posterAssetLayout.isEnabled(),\n    assetCount: window.posterAssetLayout.getSelectedKeys().length,\n    textIds: window.posterTextLayout.getSelectedIds(),\n  }))).toEqual({ context: 'text', text: true, asset: false, assetCount: 0, textIds: ['section-chair'] });\n});'''
          if old_switch not in text: raise SystemExit('old V/A switch test missing')
          text = text.replace(old_switch, new_switch, 1)
          for obsolete in ['asset-layout-mode-btn', 'data-asset-layout-count', 'switching V and A']:
              if obsolete in text: raise SystemExit(f'obsolete selection test token remains: {obsolete}')
          write(path, text)
          PY

          node --check web/editor/asset-layout.js
          node --check tests/selection-polish.spec.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/editor/asset-layout.js tests/selection-polish.spec.js
          git commit -m 'refactor: remove obsolete asset layout toolbar'
          git push origin HEAD:feat/unified-layout-auto-download
