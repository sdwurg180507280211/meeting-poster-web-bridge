name: Verify render contract

on:
  pull_request:
    paths:
      - 'mac-agent/**'
      - 'web/**'
      - 'photoshop-worker/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/verify-render-contract.yml'

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mac-agent/package-lock.json
      - run: npm ci
      - run: npm test

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/validation.js
      - run: node --check web/poster-project.js
      - run: node --check web/app.js
      - run: node --check web/draft-persistence.js
      - run: node --check web/avatar-crop-modal.js
      - run: node --check web/poster-preview.js
      - run: node --check web/asset-layout.js
      - run: node --check web/selection-polish.js
      - run: node --check web/interaction-polish.js
      - run: node --check web/canvas-pan.js
      - run: node --check web/workspace-layout.js
      - run: node --check web/preflight.js
      - run: node --check web/task-controls.js
      - run: node --check mac-agent/src/job-validation.js
      - run: node --check mac-agent/src/start.js
      - run: node --check mac-agent/src/agent.js
      - run: node --check photoshop-worker/src/constants.js
      - run: node --check photoshop-worker/src/render-contract.js
      - run: node --check photoshop-worker/src/ps-engine.js
      - run: node --check photoshop-worker/src/worker.js
      - name: Verify current-only implementation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const agent = fs.readFileSync('mac-agent/src/agent.js', 'utf8');
          const worker = fs.readFileSync('photoshop-worker/src/worker.js', 'utf8');
          const engine = fs.readFileSync('photoshop-worker/src/ps-engine.js', 'utf8');
          const validation = fs.readFileSync('web/validation.js', 'utf8');
          const app = fs.readFileSync('web/app.js', 'utf8');
          const project = fs.readFileSync('web/poster-project.js', 'utf8');
          const draft = fs.readFileSync('web/draft-persistence.js', 'utf8');
          const selection = fs.readFileSync('web/selection-polish.js', 'utf8');
          const textLayout = fs.readFileSync('web/poster-preview.js', 'utf8');
          const assetLayout = fs.readFileSync('web/asset-layout.js', 'utf8');

          for (const token of [
            'legacyClaimOne', 'legacyRecoverClaimedJobs', 'warnMigrationRequired',
            'isMissingRpcError', 'SUPABASE_SERVICE_ROLE_KEY', 'findLegacyAgentProcesses',
          ]) {
            if (agent.includes(token)) throw new Error(`Agent still contains obsolete compatibility path: ${token}`);
          }
          if (!agent.includes("sb.rpc('claim_next_poster_job'")) throw new Error('Agent must use the current atomic claim RPC');
          if (!agent.includes("sb.rpc('recover_stale_poster_jobs'")) throw new Error('Agent must use the current recovery RPC');

          for (const token of ['repairLegacyTextLayerNames', 'p.template']) {
            if (worker.includes(token) || engine.includes(token)) throw new Error(`Worker still contains obsolete compatibility path: ${token}`);
          }
          if (!worker.includes("asset.cropMode!=='baked'")) throw new Error('Worker must accept baked avatars only');
          if (/cropMode\s*===?\s*['"]raw|cropMode\s*==\s*null\s*\?\s*['"]raw/i.test(worker + engine + validation + app + draft)) {
            throw new Error('raw avatar mode must not exist in the current implementation');
          }
          if (!validation.includes("value.cropMode !== 'baked'")) throw new Error('browser validation must require baked avatars');
          if (!app.includes("cropMode: 'baked'")) throw new Error('browser submission must emit baked avatars only');
          if (!project.includes('project.buildRenderContract')) throw new Error('project module must expose an explicit render-contract builder');
          if (/createClient\s*=|client\.from\s*=|originalInsert|__posterRenderContractWrapped/.test(project)) {
            throw new Error('project module must not monkey-patch the Supabase client');
          }
          if (!app.includes('const contract = project.buildRenderContract()')) throw new Error('app must build the render contract explicitly');
          if (!app.includes('window.POSTER_APP_CLIENT = client')) throw new Error('app must publish its authenticated client explicitly');
          if (!textLayout.includes('clearSelection,') || !assetLayout.includes('clearSelection,')) {
            throw new Error('layout modules must expose clearSelection directly');
          }
          if (!selection.includes('context.api.clearSelection()') || /setEnabled\?\.\(false\).*setEnabled\?\.\(true\)/s.test(selection)) {
            throw new Error('selection coordinator must use explicit clearSelection APIs without mode-toggle fallback');
          }
          NODE
      - name: Verify Mac Agent retention default
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const agent = fs.readFileSync('mac-agent/src/agent.js', 'utf8');
          const start = fs.readFileSync('mac-agent/src/start.js', 'utf8');
          const example = fs.readFileSync('mac-agent/.env.example', 'utf8');
          if (!agent.includes("process.env.KEEP_LOCAL_JOBS || 'false'")) {
            throw new Error('agent.js must default KEEP_LOCAL_JOBS to false even when started directly');
          }
          if (!start.includes("process.env.KEEP_LOCAL_JOBS = 'false'")) {
            throw new Error('start.js must keep the production retention default false');
          }
          if (!/^KEEP_LOCAL_JOBS=false$/m.test(example)) {
            throw new Error('.env.example must document KEEP_LOCAL_JOBS=false');
          }
          NODE
      - name: Verify web interaction polish wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const polish = fs.readFileSync('web/interaction-polish.js', 'utf8');
          if (!html.includes('interaction-polish.css') || !html.includes('interaction-polish.js')) {
            throw new Error('index.html must load interaction-polish assets');
          }
          if (html.indexOf('interaction-polish.js') < html.indexOf('agenda-professor.js')) {
            throw new Error('interaction-polish.js must load after the existing editor modules');
          }
          if (!polish.includes('stage-zoom-controls')) throw new Error('zoom controls must live directly on the stage');
          if (/supabase|poster_jobs|protocolVersion|assetLayout/.test(polish)) {
            throw new Error('interaction-polish.js must remain UI-only and must not own render protocol logic');
          }
          NODE
      - name: Verify draggable canvas workspace wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const pan = fs.readFileSync('web/canvas-pan.js', 'utf8');
          if (!html.includes('canvas-pan.css') || !html.includes('canvas-pan.js')) {
            throw new Error('index.html must load the draggable canvas workspace assets');
          }
          if (html.indexOf('canvas-pan.js') < html.indexOf('interaction-polish.js')) {
            throw new Error('canvas-pan.js must load after interaction-polish.js so zoom controls already exist');
          }
          if (!pan.includes('viewport.scrollLeft') || !pan.includes('viewport.scrollTop')) {
            throw new Error('canvas panning must use viewport scrolling instead of changing poster geometry');
          }
          if (/style\.transform\s*=|protocolVersion|assetLayout|poster_jobs|supabase/i.test(pan)) {
            throw new Error('canvas-pan.js must remain navigation-only and must not own render geometry/protocol logic');
          }
          for (const selector of ['.canvas-avatar-slot', '.canvas-qr-slot', '.poster-preview-text']) {
            if (!pan.includes(selector)) throw new Error(`canvas pan must protect interactive element ${selector}`);
          }
          NODE
      - name: Verify clean workspace and resizable inspector
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const css = fs.readFileSync('web/workspace-layout.css', 'utf8');
          const js = fs.readFileSync('web/workspace-layout.js', 'utf8');
          if (!html.includes('workspace-layout.css') || !html.includes('workspace-layout.js')) {
            throw new Error('index.html must load workspace-layout assets');
          }
          for (const token of ['stage-toolbar', 'toggleTextLayout', 'resetTextLayout']) {
            if (html.includes(token) || css.includes(token)) throw new Error(`obsolete toolbar artifact must be deleted: ${token}`);
          }
          if (!js.includes("style.setProperty('--inspector-width'")) {
            throw new Error('inspector resizing must be driven by the workspace width CSS variable');
          }
          if (!js.includes("addEventListener('pointermove'")) {
            throw new Error('inspector resize handle must support pointer dragging');
          }
          if (/supabase|poster_jobs|protocolVersion|assetLayout/i.test(js)) {
            throw new Error('workspace-layout.js must remain UI-only');
          }
          NODE
      - name: Verify preflight and task controls wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const preflight = fs.readFileSync('web/preflight.js', 'utf8');
          const controls = fs.readFileSync('web/task-controls.js', 'utf8');
          const migration = fs.readFileSync('supabase/005_preflight_and_job_controls.sql', 'utf8');
          const restriction = fs.readFileSync('supabase/006_restrict_preflight_rpc.sql', 'utf8');
          if (!html.includes('preflight.css') || !html.includes('preflight.js')) throw new Error('preflight assets are not wired');
          if (!html.includes('task-controls.css') || !html.includes('task-controls.js')) throw new Error('task control assets are not wired');
          if (!preflight.includes("rpc('poster_preflight'")) throw new Error('preflight must use the database capability RPC');
          if (!preflight.includes('window.POSTER_APP_CLIENT')) throw new Error('preflight must reuse the authenticated application client');
          if (!controls.includes("rpc(rpcName")) throw new Error('task controls must call RPCs through the authenticated app client');
          for (const token of ['cancel_poster_job', 'retry_poster_job', 'poster_preflight', "'cancelled'"]) {
            if (!migration.includes(token)) throw new Error(`005 migration is missing ${token}`);
          }
          if (!/revoke\s+execute\s+on\s+function\s+public\.poster_preflight\(text\)\s+from\s+anon/i.test(restriction)) {
            throw new Error('006 migration must remove anonymous execution of poster_preflight');
          }
          NODE
      - name: Verify PSD template preflight guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const worker = fs.readFileSync('photoshop-worker/src/worker.js', 'utf8');
          const constants = fs.readFileSync('photoshop-worker/src/constants.js', 'utf8');
          if (!worker.includes('validateSelectedTemplate')) throw new Error('Worker must validate the selected PSD template before auto-start');
          if (!worker.includes("writeHeartbeat('template_error')")) throw new Error('Worker must publish template_error on invalid PSD templates');
          if (!constants.includes("TEMPLATE_VERSION: 'chronic-care-v10'")) throw new Error('PSD template version must be explicit');
          NODE
      - name: Verify UXP worker bootstrap wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('photoshop-worker/index.html', 'utf8');
          const worker = fs.readFileSync('photoshop-worker/src/worker.js', 'utf8');
          const contract = fs.readFileSync('photoshop-worker/src/render-contract.js', 'utf8');
          if (html.includes('src/render-contract.js')) {
            throw new Error('render-contract.js must not be loaded as a global <script> in UXP');
          }
          if (!worker.includes("require('./src/render-contract')")) {
            throw new Error('worker.js must require the wrapped render-contract module');
          }
          if (!contract.includes('module.exports = engine')) {
            throw new Error('render-contract.js must export the wrapped engine');
          }
          NODE

  browser-e2e:
    runs-on: ubuntu-latest
    needs: javascript-syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
