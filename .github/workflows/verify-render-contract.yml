name: Verify render contract

on:
  pull_request:
    paths:
      - 'mac-agent/**'
      - 'web/**'
      - 'photoshop-worker/**'
      - 'supabase/**'
      - '.github/workflows/verify-render-contract.yml'

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mac-agent/package-lock.json
      - run: npm ci
      - run: npm test

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/poster-project.js
      - run: node --check web/interaction-polish.js
      - run: node --check web/canvas-pan.js
      - run: node --check mac-agent/src/job-validation.js
      - run: node --check mac-agent/src/start.js
      - run: node --check photoshop-worker/src/constants.js
      - run: node --check photoshop-worker/src/render-contract.js
      - run: node --check photoshop-worker/src/worker.js
      - name: Verify web interaction polish wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const polish = fs.readFileSync('web/interaction-polish.js', 'utf8');
          if (!html.includes('interaction-polish.css')) {
            throw new Error('index.html must load interaction-polish.css');
          }
          if (!html.includes('interaction-polish.js')) {
            throw new Error('index.html must load interaction-polish.js');
          }
          if (html.indexOf('interaction-polish.js') < html.indexOf('agenda-professor.js')) {
            throw new Error('interaction-polish.js must load after the existing editor modules');
          }
          if (/supabase|poster_jobs|protocolVersion|assetLayout/.test(polish)) {
            throw new Error('interaction-polish.js must remain UI-only and must not own render protocol logic');
          }
          NODE
      - name: Verify draggable canvas workspace wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const pan = fs.readFileSync('web/canvas-pan.js', 'utf8');
          if (!html.includes('canvas-pan.css') || !html.includes('canvas-pan.js')) {
            throw new Error('index.html must load the draggable canvas workspace assets');
          }
          if (html.indexOf('canvas-pan.js') < html.indexOf('interaction-polish.js')) {
            throw new Error('canvas-pan.js must load after interaction-polish.js so zoom controls already exist');
          }
          if (!pan.includes('viewport.scrollLeft') || !pan.includes('viewport.scrollTop')) {
            throw new Error('canvas panning must use viewport scrolling instead of changing poster geometry');
          }
          if (/style\.transform\s*=|protocolVersion|assetLayout|poster_jobs|supabase/i.test(pan)) {
            throw new Error('canvas-pan.js must remain navigation-only and must not own render geometry/protocol logic');
          }
          for (const selector of ['.canvas-avatar-slot', '.canvas-qr-slot', '.poster-preview-text']) {
            if (!pan.includes(selector)) throw new Error(`canvas pan must protect interactive element ${selector}`);
          }
          NODE
      - name: Verify UXP worker bootstrap wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('photoshop-worker/index.html', 'utf8');
          const worker = fs.readFileSync('photoshop-worker/src/worker.js', 'utf8');
          const contract = fs.readFileSync('photoshop-worker/src/render-contract.js', 'utf8');
          if (html.includes('src/render-contract.js')) {
            throw new Error('render-contract.js must not be loaded as a global <script> in UXP');
          }
          if (!worker.includes("require('./src/render-contract')")) {
            throw new Error('worker.js must require the wrapped render-contract module');
          }
          if (!contract.includes('module.exports = engine')) {
            throw new Error('render-contract.js must export the wrapped engine');
          }
          NODE
