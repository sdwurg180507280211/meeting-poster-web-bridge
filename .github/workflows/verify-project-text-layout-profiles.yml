name: Verify project text layout profiles

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/project-text-layout-profiles]

jobs:
  project-text-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check web/project/text-layout-profiles.js
      - run: node --check web/project/project-registry.js
      - name: Verify project text layout wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const registry = fs.readFileSync('web/project/project-registry.js', 'utf8');
          const profiles = fs.readFileSync('web/project/text-layout-profiles.js', 'utf8');

          const posterProjectIndex = html.indexOf('poster-project.js');
          const profilesIndex = html.indexOf('text-layout-profiles.js');
          const registryIndex = html.indexOf('project-registry.js');
          if (!(posterProjectIndex >= 0 && profilesIndex > posterProjectIndex && registryIndex > profilesIndex)) {
            throw new Error('text-layout-profiles.js must load after poster-project.js and before project-registry.js');
          }

          const expected = [
            ['chronic-care-2026', 'yilu-changan-text-v1'],
            ['tonghu-jiankang', 'tonghu-jiankang-text-v1'],
            ['tongxin-hujian', 'tongxin-hujian-text-v1'],
          ];
          for (const [projectId, profileId] of expected) {
            if (!registry.includes(`id: '${projectId}'`) || !registry.includes(`textLayoutProfile: '${profileId}'`)) {
              throw new Error(`Missing project/profile mapping: ${projectId} -> ${profileId}`);
            }
            if (!profiles.includes(`'${profileId}': createProfile('${profileId}')`)) {
              throw new Error(`Missing text layout profile: ${profileId}`);
            }
          }

          if (!registry.includes('posterProject.textItems = projectTextItems')) {
            throw new Error('Active project must install its own textItems');
          }
          if (/protocolVersion|assetLayout|poster_jobs|supabase/i.test(profiles)) {
            throw new Error('Text layout profiles must remain Web-preview-only');
          }
          NODE
