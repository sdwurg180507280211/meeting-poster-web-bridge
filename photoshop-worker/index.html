<!doctype html><html><head><meta charset="utf-8"><style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#ddd;background:#2b2b2b}#scroll{position:absolute;inset:0;overflow-y:auto;padding:16px;box-sizing:border-box}h1{font-size:20px;margin:0 0 6px}p{color:#aaa;font-size:12px;line-height:1.5}.card{border:1px solid #4a4a4a;border-radius:10px;padding:12px;margin-top:12px;background:#333}button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:7px;background:#4d63d8;color:#fff;font-weight:600}.path{font-size:11px;color:#bbb;word-break:break-all;background:#292929;padding:8px;border-radius:6px;margin-top:7px}.ok{color:#72d6a5}.bad{color:#ff8b8b}pre{white-space:pre-wrap;font-size:11px;line-height:1.45;background:#242424;padding:10px;border-radius:7px;max-height:300px;overflow:auto}</style></head>
<body><div id="scroll"><h1>海报 Web Worker</h1><p>保持 Photoshop 与此面板打开。Mac Agent 把任务写入 Workspace 后，本插件会自动调用已验证的 v3.0.6 海报引擎生成 PSD/PNG。</p>
<div class="card"><strong>一次性设置</strong><button id="pickTemplate">选择 PSD 母版</button><div id="templatePath" class="path">未选择</div><button id="pickWorkspace">选择 Agent Workspace</button><div id="workspacePath" class="path">未选择</div></div>
<div class="card"><strong>自动接单</strong><div id="state">未就绪</div><button id="toggle">启动自动接单</button><button id="scan">立即扫描一次</button></div>
<div class="card"><strong>运行记录</strong><pre id="log"></pre></div>
<script src="src/worker.js"></script></div></body></html>
